<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Sign In - La Bella Vita POS</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            font-family: 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1.25rem;
        }

        .auth-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            padding: 2.25rem 2rem;
            transition: all 0.3s ease;
        }

        .brand-icon-box {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            margin: 0 auto 1rem;
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.3);
        }

        .input-box-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon-left {
            position: absolute;
            left: 16px;
            color: #94a3b8;
            font-size: 1rem;
            transition: color 0.2s ease;
            pointer-events: none;
            z-index: 5;
        }

        .input-icon-right {
            position: absolute;
            right: 16px;
            color: #94a3b8;
            font-size: 1rem;
            cursor: pointer;
            transition: color 0.2s ease;
            z-index: 5;
        }

        .input-icon-right:hover {
            color: #2563eb;
        }

        .custom-input {
            width: 100%;
            background-color: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            padding: 0.75rem 1rem 0.75rem 2.8rem;
            font-size: 0.95rem;
            color: #1e293b;
            outline: none;
            transition: all 0.2s ease;
        }

        .custom-input.has-right-icon {
            padding-right: 2.8rem;
        }

        .custom-input:focus {
            background-color: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .input-box-group:focus-within .input-icon-left {
            color: #2563eb;
        }

        .btn-submit {
            background: linear-gradient(90deg, #2563eb 0%, #3b82f6 100%);
            border: none;
            color: white;
            padding: 0.8rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            background: linear-gradient(90deg, #1d4ed8 0%, #2563eb 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
            color: white;
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <!-- Brand Header -->
        <div class="text-center mb-4">
            <div class="brand-icon-box">
                <i class="fas fa-utensils"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">La Bella Vita</h3>
            <p class="text-muted small mb-2">POS & Restaurant System</p>
            <div class="badge bg-primary bg-opacity-10 text-primary px-3 py-1 rounded-pill fw-normal" style="font-size: 0.8rem;">
                <i class="fas fa-right-to-bracket me-1"></i> เข้าสู่ระบบ
            </div>
        </div>

        <!-- Alert Notifications -->
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ 'danger' if category in ['error', 'danger'] else 'success' }} alert-dismissible fade show border-0 shadow-sm rounded-3 py-2 px-3 mb-3 small" role="alert">
            <div class="d-flex align-items-center gap-2">
                <i class="fas {{ 'fa-circle-exclamation text-danger' if category in ['error', 'danger'] else 'fa-circle-check text-success' }}"></i>
                <span>{{ message }}</span>
            </div>
            <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <!-- Form -->
        <form method="POST" action="{{ url_for('signin') if 'signin' in config.get('ENDPOINTS', {}) else '' }}" class="needs-validation" novalidate>
            <!-- Security CSRF Token -->
            {% if csrf_token %}
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            {% endif %}

            <!-- Username Field -->
            <div class="mb-3">
                <label for="username" class="form-label small fw-semibold text-secondary">Username (ชื่อผู้ใช้งาน)</label>
                <div class="input-box-group">
                    <i class="fas fa-user input-icon-left"></i>
                    <input type="text" id="username" name="username" class="custom-input"
                        placeholder="กรอกชื่อผู้ใช้งาน" required autocomplete="username" autofocus>
                </div>
            </div>

            <!-- Password Field -->
            <div class="mb-3">
                <label for="password" class="form-label small fw-semibold text-secondary">Password (รหัสผ่าน)</label>
                <div class="input-box-group">
                    <i class="fas fa-lock input-icon-left"></i>
                    <input type="password" id="password" name="password" class="custom-input has-right-icon"
                        placeholder="กรอกรหัสผ่าน" required autocomplete="current-password">
                    <i class="fas fa-eye input-icon-right" id="togglePassword" title="แสดง/ซ่อนรหัสผ่าน"></i>
                </div>
            </div>

            <!-- Remember Me Option -->
            <div class="d-flex justify-content-between align-items-center mb-4 small">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember_me" name="remember_me">
                    <label class="form-check-label text-muted" for="remember_me">
                        จดจำการใช้งาน
                    </label>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-submit w-100 d-flex align-items-center justify-content-center gap-2 mb-3">
                <span>Sign In</span>
                <i class="fas fa-right-to-bracket"></i>
            </button>
        </form>

        <!-- Footer Link -->
        <div class="text-center pt-2 border-top border-light">
            <p class="small text-muted mb-0">
                ยังไม่มีบัญชีสมาชิก? <a href="{{ url_for('signup') if 'signup' in config.get('ENDPOINTS', {}) else '/signup' }}" class="text-primary text-decoration-none fw-semibold">สมัครสมาชิกที่นี่</a>
            </p>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    </script>
</body>

</html>
