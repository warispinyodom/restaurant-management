{% extends 'base.html' %}

{% block content %}
<style>
    .service-card {
        border-radius: 16px;
        border: 1px solid #e9ecef;
        transition: all 0.25s ease;
    }
    .service-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.08) !important;
    }
    .service-card.status-pending {
        border-left: 5px solid #dc3545;
        animation: pulse-bg-danger 1.5s infinite;
    }
    .service-card.status-in_progress {
        border-left: 5px solid #ffc107;
    }
    .service-card.status-resolved, .service-card.status-completed {
        border-left: 5px solid #198754;
        opacity: 0.75;
    }
    @keyframes pulse-bg-danger {
        0% { background-color: rgba(220, 53, 69, 0.05); }
        50% { background-color: rgba(220, 53, 69, 0.2); }
        100% { background-color: rgba(220, 53, 69, 0.05); }
    }
</style>

<div class="container-fluid px-0 py-3">
    <!-- Header Page Banner -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <div>
            <h3 class="fw-bold mb-1"><i class="fas fa-bell text-danger me-2"></i>รายการเรียกพนักงาน (Service Calls)</h3>
            <p class="text-muted mb-0 small">ติดตามและกดตอบรับการร้องขอจากลูกค้าหน้าร้านแบบ Real-time</p>
        </div>
        <div class="d-flex align-items-center gap-2">
            <button id="soundToggleBtn" class="btn btn-outline-success btn-sm rounded-pill px-3 shadow-sm" onclick="toggleSound()">
                <i class="fas fa-volume-up me-1"></i>เปิดเสียงแจ้งเตือน
            </button>
            <span class="badge bg-danger rounded-pill px-3 py-2 fs-6 shadow-sm">
                ค้างดำเนินการ: <span id="pendingRequestsCnt">0</span> รายการ
            </span>
        </div>
    </div>

    <!-- Dynamic Service Requests Grid -->
    <div class="row g-3" id="requestsGrid">
        <!-- Rendered via Realtime JS -->
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    let soundEnabled = true;
    let previousPendingCount = 0;
    let isFirstLoad = true;
    let audioCtx = null;

    function playAlertSound() {
        if (!soundEnabled) return;
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.4);
            
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        } catch (e) {
            console.log('Audio Context Error:', e);
        }
    }

    function toggleSound() {
        soundEnabled = !soundEnabled;
        const btn = document.getElementById('soundToggleBtn');
        if (soundEnabled) {
            btn.className = "btn btn-outline-success btn-sm rounded-pill px-3 shadow-sm";
            btn.innerHTML = '<i class="fas fa-volume-up me-1"></i>เปิดเสียงแจ้งเตือน';
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        } else {
            btn.className = "btn btn-outline-secondary btn-sm rounded-pill px-3 shadow-sm";
            btn.innerHTML = '<i class="fas fa-volume-mute me-1"></i>ปิดเสียงแจ้งเตือน';
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        fetchServiceRequests();
        setInterval(fetchServiceRequests, 3000);
    });

    function fetchServiceRequests() {
        fetch('/staff/api/service-requests')
            .then(res => {
                if (!res.ok) throw new Error('Network response was not ok');
                return res.json();
            })
            .then(data => {
                if (data.status === 'success') {
                    renderRequests(data.requests || []);
                }
            })
            .catch(err => console.error('Error fetching service requests:', err));
    }

    function renderRequests(requests) {
        const grid = document.getElementById('requestsGrid');
        let pendingCnt = 0;
        let html = '';

        if (!Array.isArray(requests) || requests.length === 0) {
            grid.innerHTML = `
                <div class="col-12 text-center py-5">
                    <div class="p-5 bg-white rounded-4 shadow-sm border">
                        <i class="fas fa-bell-slash fa-4x text-muted opacity-25 mb-3 d-block"></i>
                        <h5 class="fw-bold text-muted">ไม่มีรายการเรียกพนักงานที่ค้างอยู่</h5>
                        <p class="text-muted small mb-0">ระบบจะทำการอัปเดตข้อมูลให้อัตโนมัติเมื่อมีการเรียกจากลูกค้า</p>
                    </div>
                </div>`;
            document.getElementById('pendingRequestsCnt').innerText = '0';
            previousPendingCount = 0;
            return;
        }

        requests.forEach(req => {
            const st = (req.status || 'pending').toLowerCase();
            const reqId = String(req.id || '');
            const tableNo = req.table_no || req.table || '-';
            const callType = req.request_type || req.title || req.type || 'เรียกพนักงาน';
            const note = req.note || req.message || '';
            const timeStr = String(req.created_at || req.timestamp || '-').replace('T', ' ').substring(0, 16);

            if (st === 'pending') {
                pendingCnt++;
            }

            let badgeHtml = '';
            let cardClass = 'status-' + st;
            let actionBtnHtml = '';

            if (st === 'pending') {
                badgeHtml = '<span class="badge bg-danger rounded-pill"><i class="fas fa-exclamation-circle me-1"></i>รอดำเนินการ</span>';
                actionBtnHtml = `
                    <button type="button" class="btn btn-warning btn-sm rounded-pill px-3 fw-bold text-dark me-1" onclick="updateRequestStatus('${reqId}', 'in_progress')">
                        <i class="fas fa-user-check me-1"></i>รับเรื่อง
                    </button>
                    <button type="button" class="btn btn-success btn-sm rounded-pill px-3 fw-bold" onclick="updateRequestStatus('${reqId}', 'resolved')">
                        <i class="fas fa-check me-1"></i>เสร็จสิ้น
                    </button>`;
            } else if (st === 'in_progress') {
                badgeHtml = '<span class="badge bg-warning text-dark rounded-pill"><i class="fas fa-spinner fa-spin me-1"></i>กำลังดำเนินการ</span>';
                actionBtnHtml = `
                    <button type="button" class="btn btn-success btn-sm rounded-pill px-3 fw-bold" onclick="updateRequestStatus('${reqId}', 'resolved')">
                        <i class="fas fa-check me-1"></i>เสร็จสิ้น
                    </button>`;
            } else {
                badgeHtml = '<span class="badge bg-success rounded-pill"><i class="fas fa-check-circle me-1"></i>เรียบร้อย</span>';
                actionBtnHtml = `
                    <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill px-3" disabled>
                        <i class="fas fa-check me-1"></i>เสร็จสิ้นแล้ว
                    </button>`;
            }

            html += `
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card service-card shadow-sm h-100 bg-white ${cardClass}">
                    <div class="card-header bg-transparent border-0 pt-3 px-3 pb-1 d-flex justify-content-between align-items-center">
                        <span class="badge bg-primary fs-6 px-3 py-1.5 rounded-3">
                            <i class="fas fa-chair me-1"></i>โต๊ะ ${tableNo}
                        </span>
                        <div>${badgeHtml}</div>
                    </div>
                    <div class="card-body px-3 py-2 d-flex flex-column">
                        <h5 class="fw-bold text-dark mb-1"><i class="fas fa-concierge-bell text-danger me-2"></i>${callType}</h5>
                        ${note ? `<p class="text-secondary small mb-2 bg-light p-2 rounded-3 border"><i class="far fa-comment-dots me-1"></i>${note}</p>` : ''}
                        <small class="text-muted mt-auto"><i class="far fa-clock me-1"></i>เวลาที่เรียก: ${timeStr}</small>
                    </div>
                    <div class="card-footer bg-transparent border-top-0 pt-0 pb-3 px-3 text-end">
                        ${actionBtnHtml}
                    </div>
                </div>
            </div>`;
        });

        grid.innerHTML = html;
        document.getElementById('pendingRequestsCnt').innerText = pendingCnt;

        if (!isFirstLoad && pendingCnt > previousPendingCount) {
            playAlertSound();
        }
        previousPendingCount = pendingCnt;
        isFirstLoad = false;
    }

    function updateRequestStatus(reqId, status) {
        fetch('/staff/service-request/update-status', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ request_id: reqId, status: status })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                Swal.fire({
                    title: status === 'resolved' ? 'เสร็จสิ้นและลบรายการแล้ว!' : 'อัปเดตเรียบร้อย!',
                    icon: 'success',
                    timer: 1000,
                    showConfirmButton: false
                }).then(() => fetchServiceRequests());
            } else {
                Swal.fire('เกิดข้อผิดพลาด!', data.message || 'ไม่สามารถอัปเดตสถานะได้', 'error');
            }
        })
        .catch(err => {
            console.error(err);
            Swal.fire('เกิดข้อผิดพลาด!', 'ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้', 'error');
        });
    }
</script>
{% endblock %}
